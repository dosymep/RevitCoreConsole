name: Build

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
   
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run pipeline
        run: dotnet run --project build
        env:
          CONFIGURATION: Release
          REVIT_VERSIONS: 2018,2019,2020,2021,2022,2023,2024,2025,2026,2027

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
